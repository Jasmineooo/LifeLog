  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-action="go-tab" data-tab="today" aria-label="LifeLog 今日">
        <span class="brand-mark"><span>L</span><i></i></span>
        <span class="brand-text"><strong>LifeLog</strong><small>把日子过成作品</small></span>
      </a>
      <nav class="desktop-nav" aria-label="主导航">
        <button data-action="go-tab" data-tab="today"><svg class="icon"><use href="#i-sun"></use></svg>今日</button>
        <button data-action="go-tab" data-tab="calendar"><svg class="icon"><use href="#i-calendar"></use></svg>日历</button>
        <button data-action="go-tab" data-tab="stats"><svg class="icon"><use href="#i-chart"></use></svg>统计</button>
        <button data-action="go-tab" data-tab="settings"><svg class="icon"><use href="#i-settings"></use></svg>设置</button>
      </nav>
      <div class="topbar-right" id="level-chip"></div>
    </header>

    <main id="app-main" class="app-main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-action="go-tab" data-tab="today"><span class="nav-icon"><svg class="icon"><use href="#i-sun"></use></svg></span><span>今日</span></button>
      <button data-action="go-tab" data-tab="calendar"><span class="nav-icon"><svg class="icon"><use href="#i-calendar"></use></svg></span><span>日历</span></button>
      <button class="nav-add" data-action="open-plan" aria-label="新增计划"><span class="nav-add-btn"><svg class="icon"><use href="#i-plus"></use></svg></span><span>排计划</span></button>
      <button data-action="go-tab" data-tab="stats"><span class="nav-icon"><svg class="icon"><use href="#i-chart"></use></svg></span><span>统计</span></button>
      <button data-action="go-tab" data-tab="settings"><span class="nav-icon"><svg class="icon"><use href="#i-settings"></use></svg></span><span>设置</span></button>
    </nav>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
  <script src="./autobackup.js"></script>
