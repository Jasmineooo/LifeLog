<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的工作台</title>
<link rel="icon" type="image/png" href="icons/backup-icon.png">
<link rel="apple-touch-icon" href="icons/backup-icon-180.png">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#0d1117">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --text: #e6e9ef;
    --muted: #8b94a7;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; min-width: 0; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }
  button:active { opacity: .82; }
  button:disabled { opacity: .5; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-weight: 500;
  }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row > * { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  input[type="search"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #0b0d11;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    margin-bottom: 10px;
  }
  input[type="search"]:focus { outline: none; border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    border-top: 1px solid var(--line);
    padding: 11px 0;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  li:first-child { border-top: 0; }
  .k {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--accent);
    word-break: break-all;
    flex: 1;
  }
  .v {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #2b3242;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .22s ease;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }
  .last { font-size: 14px; }
  .last b { font-variant-numeric: tabular-nums; }
  .last .warn { color: #f5a623; }

  /* ---------- 今日工作台 ---------- */
  .hello { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .dateline { color: var(--muted); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .herohint { margin-top: 10px; font-size: 13px; color: #c3cde0; }
  .herohint b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .apps { padding: 15px 14px 14px; }
  .cardhead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; font-size: 12.5px; color: var(--muted); margin: 0 2px 10px;
  }
  .cardhead b { font-size: 14px; color: var(--text); font-weight: 600; }
  .appgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .app {
    display: block;
    min-width: 0;
    text-decoration: none;
    color: inherit;
    background: #12151c;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 12px 11px;
    transition: border-color .18s ease, transform .12s ease;
  }
  .app:active { transform: scale(.985); border-color: #39415a; }
  .app.wide { grid-column: 1 / -1; }
  .app .top { display: flex; align-items: center; gap: 7px; }
  .app .ico {
    width: 22px; height: 22px; border-radius: 7px; flex: 0 0 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .app .an {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .app .go { color: #5a6480; font-size: 15px; line-height: 1; }
  .app .av {
    margin-top: 9px; font-size: clamp(19px, 5.6vw, 23px); font-weight: 700;
    line-height: 1.15; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .app .av.muted { color: var(--muted); font-size: 16px; font-weight: 500; }
  .app .ac { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .app .ad {
    color: #9aa4ba; font-size: 12px; margin-top: 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .app.warn { border-color: #4a3d24; }
  .app.warn .av { color: #f0b95a; }
  .app.bad { border-color: #5a2a2e; }
  .app.bad .an, .app.bad .av { color: #ff8b8b; }
  .ritem {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .ritem:first-child { border-top: 0; padding-top: 2px; }
  .ritem .dot {
    flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%;
    margin-top: 7px; background: var(--accent); display: block;
  }
  .ritem.warn .dot { background: #f5a623; }
  .ritem.danger .dot { background: #ff5d5d; }
  .ritem span { flex: 1; min-width: 0; }
  .ritem a { flex: 0 0 auto; color: var(--accent); text-decoration: none; font-size: 12.5px; }
  .sechead { font-size: 12.5px; color: var(--muted); margin: 22px 4px 8px; font-weight: 500; letter-spacing: .4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的工作台</h1>
  <div class="sub" id="origin"></div>

  <div class="card">
    <div class="hello" id="hello">你好</div>
    <div class="dateline" id="dateline">北京时间</div>
    <div class="herohint" id="heroHint"></div>
  </div>

  <div class="card apps">
    <div class="cardhead"><b>今日状态</b><span id="appsHint"></span></div>
    <div class="appgrid" id="appGrid"></div>
  </div>

  <div class="card">
    <div class="cardhead"><b>提醒</b><span id="reminderHint"></span></div>
    <ul id="reminderList"></ul>
  </div>

  <h2 class="sechead">数据备份</h2>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="count">0</b><span>数据项</span></div>
      <div class="stat"><b id="size">0 B</b><span>占用大小</span></div>
      <div class="stat"><b id="idbCount">–</b><span>本地数据库</span></div>
    </div>
  </div>

  <div class="card">
    <div class="last">最近备份：<b id="lastTime">还没有备份记录</b></div>
    <p class="hint" id="lastHint">建议每周备份一次，并把文件保存到电脑或网盘。</p>
  </div>

  <div class="card">
    <button id="btnBackup">一键备份全部数据</button>
    <div class="row">
      <button class="ghost" id="btnRestore">从文件恢复</button>
      <button class="ghost" id="btnCopy">复制 JSON</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <p class="hint">备份包含 localStorage 与 IndexedDB；API Key 不写入备份，恢复时保留本机已有的 Key。</p>
  </div>

  <div class="card">
    <input type="search" id="filter" placeholder="筛选数据项…">
    <ul id="list"></ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var INTERNAL = ['__autoBackupAt', '__lastBackupAt'];
  var IDB_FALLBACK = ['yebian-db'];

  // 备份时剔除的敏感字段：键名 → 字段名
  var REDACT = { 'yebian.settings.v1': ['apiKey'], 'ai.settings.v1': ['apiKey'] };
  var REDACTED = ['yebian.settings.v1.apiKey', 'ai.settings.v1.apiKey'];

  function redactValue(key, raw) {
    var fields = REDACT[key];
    if (!fields || typeof raw !== 'string') return raw;
    try {
      var obj = JSON.parse(raw);
      fields.forEach(function (f) { delete obj[f]; });
      return JSON.stringify(obj);
    } catch (e) {
      return raw;
    }
  }

  // 恢复时保留本机已有的敏感字段，避免把 API Key 清空
  function mergeSecret(key, incoming) {
    var fields = REDACT[key];
    if (!fields) return incoming;
    var current = localStorage.getItem(key);
    if (!current) return incoming;
    try {
      var oldObj = JSON.parse(current);
      var newObj = JSON.parse(incoming);
      fields.forEach(function (f) {
        if (oldObj[f] !== undefined && oldObj[f] !== '') newObj[f] = oldObj[f];
      });
      return JSON.stringify(newObj);
    } catch (e) {
      return incoming;
    }
  }
  var $ = function (id) { return document.getElementById(id); };
  var toastTimer = null;

  /* ---------------- 北京时间工具 ---------------- */
  // 页面上的日期与时间一律按北京时间显示，不受设备时区影响
  var TZ = 'Asia/Shanghai';

  function pad2(n) { return String(n).padStart(2, '0'); }

  function bjParts(date) {
    var d = date instanceof Date ? date : new Date(date || Date.now());
    try {
      var parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(d);
      var get = function (t) {
        var hit = parts.find(function (x) { return x.type === t; });
        return hit ? hit.value : '';
      };
      return { y: get('year'), m: get('month'), d: get('day'), h: Number(get('hour')) || 0, min: get('minute') };
    } catch (e) {
      return { y: String(d.getFullYear()), m: pad2(d.getMonth() + 1), d: pad2(d.getDate()), h: d.getHours(), min: pad2(d.getMinutes()) };
    }
  }

  function bjToday() { var p = bjParts(); return p.y + '-' + p.m + '-' + p.d; }
  function bjDateStr(ts) { var p = bjParts(ts); return p.y + '-' + p.m + '-' + p.d; }
  function bjFull(ts) {
    var p = bjParts(ts);
    return p.y + '-' + p.m + '-' + p.d + ' ' + pad2(p.h) + ':' + p.min;
  }

  function dayDiff(from, to) {
    if (!from || !to) return 0;
    var a = Date.parse(from + 'T00:00:00Z');
    var b = Date.parse(to + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.round((b - a) / 86400000);
  }

  var CN_WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function weekdayCN(dateStr) {
    var p = String(dateStr).split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2], 12);
    return CN_WEEK[d.getDay()] || '';
  }

  function shortDate(dateStr) { return String(dateStr || '').slice(5); }

  function money(cents) {
    var v = Math.round(Number(cents) || 0) / 100;
    var s = v.toFixed(2).replace(/\.00$/, '');
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }

  function greeting(hour) {
    if (hour < 5) return '夜深了';
    if (hour < 9) return '早上好';
    if (hour < 12) return '上午好';
    if (hour < 14) return '中午好';
    if (hour < 18) return '下午好';
    return '晚上好';
  }

  function appUrl(name) {
    try { return new URL('../' + name + '/', location.href).href; }
    catch (e) { return '../' + name + '/'; }
  }

  function getNum(key) {
    try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
  }

  // 只读解析，解析失败不会写入任何数据
  function readJSON(key) {
    var raw;
    try { raw = localStorage.getItem(key); }
    catch (e) { return { ok: false, empty: false, value: null }; }
    if (raw === null || raw === undefined) return { ok: true, empty: true, value: null };
    try { return { ok: true, empty: false, value: JSON.parse(raw) }; }
    catch (e) { return { ok: false, empty: false, value: null }; }
  }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ---------------- localStorage ---------------- */

  function snapshot() {
    var data = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (INTERNAL.indexOf(k) !== -1) continue;
      data[k] = redactValue(k, localStorage.getItem(k));
    }
    return data;
  }

  function byteSize(str) {
    return new Blob([str]).size;
  }

  function fmt(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function stamp() {
    var p = bjParts();
    return p.y + '-' + p.m + '-' + p.d + '-' + pad2(p.h) + p.min;
  }

  function download(text, filename) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(url);
      a.remove();
    }, 2000);
  }

  /* ---------------- IndexedDB ---------------- */

  function openDb(name, createMeta) {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(name);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!createMeta) return;
        Object.keys(createMeta.stores || {}).forEach(function (s) {
          if (db.objectStoreNames.contains(s)) return;
          var m = createMeta.stores[s];
          var opts = { autoIncrement: !!m.autoIncrement };
          if (m.keyPath) opts.keyPath = m.keyPath;
          db.createObjectStore(s, opts);
        });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('数据库被其他标签页占用')); };
    });
  }

  function readStore(db, storeName) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(storeName, 'readonly');
      var os = t.objectStore(storeName);
      var meta = {
        keyPath: os.keyPath,
        autoIncrement: os.autoIncrement,
        records: []
      };
      var req = os.openCursor();
      req.onsuccess = function () {
        var c = req.result;
        if (c) {
          meta.records.push({ k: c.primaryKey, v: c.value });
          c.continue();
        } else {
          resolve(meta);
        }
      };
      req.onerror = function () { reject(req.error); };
    });
  }

  function listDbNames() {
    if (indexedDB.databases) {
      return indexedDB.databases().then(function (list) {
        return (list || []).map(function (d) { return d.name; }).filter(Boolean);
      }).catch(function () { return IDB_FALLBACK; });
    }
    return Promise.resolve(IDB_FALLBACK);
  }

  function dumpIndexedDB() {
    if (!window.indexedDB) return Promise.resolve({});
    return listDbNames().then(function (names) {
      var out = {};
      return names.reduce(function (chain, name) {
        return chain.then(function () {
          return openDb(name).then(function (db) {
            var storeNames = Array.prototype.slice.call(db.objectStoreNames);
            var stores = {};
            return storeNames.reduce(function (inner, s) {
              return inner.then(function () {
                return readStore(db, s).then(function (m) { stores[s] = m; });
              });
            }, Promise.resolve()).then(function () {
              out[name] = { version: db.version, stores: stores };
              db.close();
            });
          }).catch(function () { /* 单个库失败不影响其他库 */ });
        });
      }, Promise.resolve()).then(function () { return out; });
    });
  }

  function writeStore(db, storeName, meta) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(storeName, 'readwrite');
      var os = t.objectStore(storeName);
      os.clear();
      (meta.records || []).forEach(function (r) {
        if (os.keyPath) os.put(r.v);
        else os.put(r.v, r.k);
      });
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };
      t.onabort = function () { reject(t.error); };
    });
  }

  function openForRestore(name, meta) {
    return openDb(name).then(function (db) {
      var missing = Object.keys(meta.stores || {}).filter(function (s) {
        return !db.objectStoreNames.contains(s);
      });
      if (!missing.length) return db;

      var nextVersion = db.version + 1;
      db.close();
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open(name, nextVersion);
        req.onupgradeneeded = function () {
          var d = req.result;
          missing.forEach(function (s) {
            var m = meta.stores[s];
            var opts = { autoIncrement: !!m.autoIncrement };
            if (m.keyPath) opts.keyPath = m.keyPath;
            d.createObjectStore(s, opts);
          });
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
        req.onblocked = function () { reject(new Error('数据库被其他标签页占用')); };
      });
    });
  }

  function restoreIndexedDB(snapshot) {
    var names = Object.keys(snapshot || {});
    return names.reduce(function (chain, name) {
      return chain.then(function () {
        var meta = snapshot[name];
        return openForRestore(name, meta).then(function (db) {
          var stores = Object.keys(meta.stores || {});
          return stores.reduce(function (inner, s) {
            return inner.then(function () { return writeStore(db, s, meta.stores[s]); });
          }, Promise.resolve()).then(function () { db.close(); });
        });
      });
    }, Promise.resolve());
  }

  /* ---------------- 导出与恢复 ---------------- */

  function buildPayload(idb) {
    var data = snapshot();
    return {
      exportedAt: new Date().toISOString(),
      origin: location.origin,
      count: Object.keys(data).length,
      data: data,
      indexedDB: idb || {},
      redacted: REDACTED
    };
  }

  function render() {
    var data = snapshot();
    var keys = Object.keys(data);
    var total = 0;
    var kw = $('filter').value.trim().toLowerCase();
    var list = $('list');
    list.innerHTML = '';

    var shown = 0;
    keys.sort().forEach(function (k) {
      var v = data[k] || '';
      total += byteSize(k) + byteSize(v);
      if (kw && k.toLowerCase().indexOf(kw) === -1) return;
      shown++;
      var li = document.createElement('li');
      var name = document.createElement('span');
      name.className = 'k';
      name.textContent = k;
      var meta = document.createElement('span');
      meta.className = 'v';
      meta.textContent = fmt(byteSize(v));
      li.appendChild(name);
      li.appendChild(meta);
      list.appendChild(li);
    });

    if (!shown) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = keys.length ? '没有匹配的数据项' : '当前站点还没有数据';
      list.appendChild(empty);
    }

    $('count').textContent = keys.length;
    $('size').textContent = fmt(total);
    $('origin').textContent = '数据备份中心 · ' + location.host;
  }

  function refreshIdbCount() {
    if (!window.indexedDB) { $('idbCount').textContent = '0'; return; }
    listDbNames().then(function (names) {
      $('idbCount').textContent = names.length;
    }).catch(function () { $('idbCount').textContent = '?'; });
  }

  /* ---------------- 今日工作台（只读汇总） ---------------- */

  function baseCard(app, name, short, color) {
    return {
      app: app, name: name, short: short, color: color, url: appUrl(app),
      value: '—', cap: '', detail: '', tone: '', active: false
    };
  }

  function lifeStatus(today, hour) {
    var card = baseCard('LifeLog', 'LifeLog', '生', '#7BA37A');
    var out = { card: card, reminders: [] };
    var r = readJSON('lifelog.v1');
    if (!r.ok) {
      card.tone = 'bad'; card.cap = '数据读取异常'; card.detail = '先到下方备份恢复';
      out.reminders.push({ tone: 'danger', text: 'LifeLog 数据读取异常，先不要在该应用里保存，请用下方备份恢复。', app: 'LifeLog' });
      return out;
    }
    var state = r.value;
    if (!state) { card.cap = '还没有数据'; card.detail = '打开应用开始记录'; return out; }
    if (!Array.isArray(state.entries) || !Array.isArray(state.programs)) {

    var card = baseCard('FinanceLog', 'FinanceLog', '资', '#2E8B6A');
    var out = { card: card, reminders: [] };
    var r = readJSON('finance.v1');

      return out;
    }
    var st = r.value;
    if (!st) { card.cap = '还没有持仓'; card.detail = '打开应用上传持仓截图'; return out; }
    if (!Array.isArray(st.positions) || !Array.isArray(st.accounts)) {
      card.tone = 'bad'; card.cap = '数据结构异常'; card.detail = '先到下方备份恢复';
      out.reminders.push({ tone: 'danger', text: 'FinanceLog 数据结构异常，先不要在该应用里保存，请用下方备份恢复。', app: 'FinanceLog' });
      return out;
    }

    var SCALE = 10000;
    function mv(p) {
      if (p.type === 'cash') return Number(p.quantity) || 0;
      var mult = p.type === 'option' ? (Number(p.option && p.option.multiplier) || 10000) : 1;
      // 期权卖方是负债，按负数计入
      var sign = (p.type === 'option' && p.option && p.option.direction === 'short') ? -1 : 1;
      return sign * (Number(p.quantity) || 0) * (Number(p.currentPrice) || 0) * mult / SCALE;
    }

    var total = 0;
    var count = 0;
    var stale = 0;
    st.positions.forEach(function (p) {
      if (!p) return;
      total += mv(p);
      if (p.type === 'cash') return;
      count += 1;
      var d = String(p.updatedAt || '').slice(0, 10);
      if (!d || dayDiff(d, today) >= 7) stale += 1;
    });

    var day = 0;
    var hasDay = false;
    st.accounts.forEach(function (a) {
      if (!a) return;
      if (typeof a.dayPnl === 'number' && isFinite(a.dayPnl)) { day += a.dayPnl; hasDay = true; }
    });

    card.value = '¥' + money(Math.round(total * 100));
    card.cap = count ? '总资产 · ' + count + ' 个持仓' : '还没有持仓';
    card.detail = hasDay
      ? '今日 ' + (day >= 0 ? '+' : '-') + '¥' + money(Math.abs(Math.round(day * 100)))
      : (count ? '今日盈亏未录入' : '打开应用录入持仓');
    card.active = hasDay || count > 0;

    if (stale) {
      card.tone = 'warn';
      out.reminders.push({ tone: 'info', text: 'FinanceLog 有 ' + stale + ' 个持仓超过 7 天没更新价格。', app: 'FinanceLog' });
    }
    return out;
  }

  $('file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;

    file.text().then(function (text) {
      var obj;
      try { obj = JSON.parse(text); } catch (err) { return toast('文件不是合法的 JSON'); }

      var data = obj && obj.data && typeof obj.data === 'object' && !Array.isArray(obj.data)
        ? obj.data : obj;
      if (!data || typeof data !== 'object' || Array.isArray(data)) return toast('无法识别的备份格式');

      var keys = Object.keys(data);
      var dbs = obj && obj.indexedDB ? Object.keys(obj.indexedDB) : [];
      if (!keys.length && !dbs.length) return toast('备份里没有数据');

      var when = '未知时间';
      if (obj.exportedAt) {
        var exportedTs = Date.parse(obj.exportedAt);
        if (!isNaN(exportedTs)) when = bjFull(exportedTs) + '（北京时间）';
      }
      var ok = confirm(
        '将写入 ' + keys.length + ' 个数据项' +
        (dbs.length ? '、覆盖 ' + dbs.length + ' 个数据库' : '') +
        '。\n\n来源站点：' + (obj.origin || '未知') +
        '\n备份时间：' + when + '\n\n确定恢复？'
      );
      if (!ok) return;

      try {
        keys.forEach(function (k) { localStorage.setItem(k, mergeSecret(k, data[k])); });
      } catch (err) {
        return toast('写入 localStorage 失败：' + err.message);
      }

      restoreIndexedDB(obj.indexedDB || {}).then(function () {
        render();
        refreshIdbCount();
        toast('已恢复 ' + keys.length + ' 项，刷新页面后生效');
      }).catch(function (e) {
        render();
        toast('部分数据库恢复失败：' + (e && e.message ? e.message : e));
      });
    });
  });

  $('filter').addEventListener('input', render);

  render();
  refreshIdbCount();
  renderWorkbench();
  renderStatus();

  // 回到页面时刷新今日概览，跨天也能更新
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      renderWorkbench();
      renderStatus();
    }
  });
})();
</script>
</body>
</html>
